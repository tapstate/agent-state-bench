version: tapstate/v1
kind: pipeline
id: mfg_sales_line
# Staging: one flat row per ERP sales order line, with the product it names (number, name,
# subcategory, category from mfg_product_ref; the ERP sku is the canonical product number).
# Written to views.mfg_sales_line and read back by mfg_sales_orders. Resolved on a root for the
# reason given in mfg_stock (SOURCE_SPLIT.md §3).
source: [ src_mfg_erp, src_mfg_ref ]
settings: { read_mode: snapshot_and_cdc }
transforms:
  - id: t_sol
    from: [ sales_order_lines ]
    type: js
    script: |
      function process(record, ctx) {
        // the before image too: a delete carries only that, and the nest needs its join key
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      function fix(r) {
        if (r != null) ['unit_price', 'unit_price_discount', 'line_total'].forEach(function (k) {
          r[k] = r[k] == null ? null : Number(r[k]); });
      }
  - id: assemble
    type: nest
    # the default keeps 4,000 entries per level in memory and serves the rest from MongoDB, which is
    # several times slower at this size; 250,000 holds every level of this dataset
    entries_in_memory: 250000
    from: { l: t_sol, pr: mfg_product_ref }
    root:
      from: l
      key: [ line_id ]
      embed:
        - { from: pr, on: { product_number: sku }, as: object, path: product, key: [ product_number ] }
  - id: shape
    from: [ assemble ]
    type: js
    script: |
      function product(p) {
        return p == null ? null : { product_number: p.product_number, name: p.name, subcategory: p.subcategory,
                                    category: p.category };
      }
      function process(record, ctx) {
        var r = record.after;
        if (r == null) return record;
        var o = { line_id: r.line_id, sales_order_id: r.sales_order_id, product: product(r.product) };
        ['carrier_tracking_number', 'order_qty', 'special_offer_id', 'unit_price', 'unit_price_discount',
         'line_total'].forEach(function (k) { o[k] = r[k] == null ? null : r[k]; });
        record.after = o;
        return record;
      }
view: { id: mfg_sales_line, from: shape, primary_key: line_id }
