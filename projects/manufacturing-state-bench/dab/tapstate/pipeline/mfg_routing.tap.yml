version: tapstate/v1
kind: pipeline
id: mfg_routing
# Staging: one flat row per MES routing operation, with its work center (views.mfg_routing, read
# back by mfg_work_orders). Resolved on a root for the reason given in mfg_stock (SOURCE_SPLIT.md §3).
source: [ src_mfg_mes ]
settings: { read_mode: snapshot_and_cdc }
transforms:
  - id: t_rt
    from: [ routings ]
    type: js
    script: |
      function process(record, ctx) {
        // the before image too: a delete carries only that, and the nest needs its join key
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      function fix(r) {
        if (r != null) {
          r.routing_id = r.work_order_id + '/' + r.operation_sequence;
          ['actual_resource_hrs', 'planned_cost', 'actual_cost'].forEach(function (k) {
            r[k] = r[k] == null ? null : Number(r[k]); });
        }
      }
  - id: assemble
    type: nest
    # the default keeps 4,000 entries per level in memory and serves the rest from MongoDB, which is
    # several times slower at this size; 250,000 holds every level of this dataset
    entries_in_memory: 250000
    from: { rt: t_rt, wc: work_centers }
    root:
      from: rt
      key: [ routing_id ]
      embed:
        - { from: wc, on: { work_center_id: work_center_id }, as: object, path: work_center, key: [ work_center_id ] }
  - id: shape
    from: [ assemble ]
    type: js
    script: |
      function process(record, ctx) {
        var r = record.after;
        if (r == null) return record;
        var w = r.work_center;
        var o = { routing_id: r.routing_id, work_order_id: r.work_order_id, operation_sequence: r.operation_sequence,
                  work_center: { work_center_id: r.work_center_id, name: w == null ? null : w.name } };
        ['scheduled_start_date', 'scheduled_end_date', 'actual_start_date', 'actual_end_date', 'actual_resource_hrs',
         'planned_cost', 'actual_cost'].forEach(function (k) { o[k] = r[k] == null ? null : r[k]; });
        record.after = o;
        return record;
      }
view: { id: mfg_routing, from: shape, primary_key: routing_id }
