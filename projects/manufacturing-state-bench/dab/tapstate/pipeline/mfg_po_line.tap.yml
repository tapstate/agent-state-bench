version: tapstate/v1
kind: pipeline
id: mfg_po_line
# Staging: one flat row per procurement purchase order line, with the product it names, matched on
# the procurement key format that mfg_product_ref carries (part_ref, '_' for '-'). Written to
# views.mfg_po_line and read back by mfg_purchase_orders. Resolved on a root for the reason given in
# mfg_stock (SOURCE_SPLIT.md §3).
source: [ src_mfg_procurement, src_mfg_ref ]
settings: { read_mode: snapshot_and_cdc }
transforms:
  - id: t_pol
    from: [ po_lines ]
    type: js
    script: |
      function process(record, ctx) {
        // the before image too: a delete carries only that, and the nest needs its join key
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      function fix(r) {
        if (r != null) ['unit_price', 'line_total', 'received_qty', 'rejected_qty', 'stocked_qty'].forEach(function (k) {
          r[k] = r[k] == null ? null : Number(r[k]); });
      }
  - id: assemble
    type: nest
    # the default keeps 4,000 entries per level in memory and serves the rest from MongoDB, which is
    # several times slower at this size; 250,000 holds every level of this dataset
    entries_in_memory: 250000
    from: { l: t_pol, pr: mfg_product_ref }
    root:
      from: l
      key: [ po_line_id ]
      embed:
        - { from: pr, on: { procurement_ref: part_ref }, as: object, path: product, key: [ procurement_ref ] }
  - id: shape
    from: [ assemble ]
    type: js
    script: |
      function product(p) {
        return p == null ? null : { product_number: p.product_number, name: p.name, subcategory: p.subcategory,
                                    category: p.category };
      }
      function process(record, ctx) {
        var r = record.after;
        if (r == null) return record;
        var o = { po_line_id: r.po_line_id, purchase_order_id: r.purchase_order_id, product: product(r.product) };
        ['due_date', 'order_qty', 'unit_price', 'line_total', 'received_qty', 'rejected_qty',
         'stocked_qty'].forEach(function (k) { o[k] = r[k] == null ? null : r[k]; });
        record.after = o;
        return record;
      }
view: { id: mfg_po_line, from: shape, primary_key: po_line_id }
