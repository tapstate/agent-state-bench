version: tapstate/v1
kind: pipeline
id: mfg_stock
# Staging: one flat row per WMS stock row, with the canonical product number and the location's
# name (views.mfg_stock, read back through src_mfg_stage by mfg_products). On Tapstate 0.7.0 a
# many-to-one embed under an array element attaches to only one element of the whole level, so the
# location is resolved here, on a root, where it works (SOURCE_SPLIT.md §3).
source: [ src_mfg_wms ]
settings: { read_mode: snapshot_and_cdc }
transforms:
  - id: t_stock
    from: [ stock ]
    type: js
    script: |
      function process(record, ctx) {
        // the before image too: a delete carries only that, and the nest needs its join key
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      // WMS writes the item as 'AW:' + product number
      function fix(r) { if (r != null) { r.product_number = String(r.item).split(':')[1]; r.stock_id = r._id; } }
  - id: t_loc
    from: [ locations ]
    type: js
    script: |
      function process(record, ctx) {
        // the before image too: a delete carries only that, and the nest needs its join key
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      function fix(r) { if (r != null) r.location_id = r._id; }
  - id: assemble
    type: nest
    from: { st: t_stock, lo: t_loc }
    root:
      from: st
      key: [ stock_id ]
      embed:
        - { from: lo, on: { location_id: location_id }, as: object, path: location, key: [ location_id ] }
  - id: shape
    from: [ assemble ]
    type: js
    script: |
      function process(record, ctx) {
        var r = record.after;
        if (r == null) return record;
        var l = r.location;
        record.after = { stock_id: r.stock_id, product_number: r.product_number, location_id: r.location_id,
                         location_name: l == null ? null : l.name, shelf: r.shelf, bin: r.bin, quantity: r.quantity };
        return record;
      }
view: { id: mfg_stock, from: shape, primary_key: stock_id }
