version: tapstate/v1
kind: pipeline
id: mfg_offer
# Staging: one flat row per procurement vendor offer, with the canonical product number and the
# vendor's fields (views.mfg_offer, read back by mfg_products). Resolved on a root for the reason
# given in mfg_stock (SOURCE_SPLIT.md §3).
source: [ src_mfg_procurement ]
settings: { read_mode: snapshot_and_cdc }
transforms:
  - id: t_offer
    from: [ vendor_items ]
    type: js
    script: |
      function process(record, ctx) {
        // the before image too: a delete carries only that, and the nest needs its join key
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      // procurement writes the product number with '_' in place of '-'
      function fix(r) {
        if (r != null) {
          r.product_number = String(r.part_ref).split('_').join('-');
          r.offer_id = r.part_ref + '/' + r.vendor_id;
          r.standard_price = r.standard_price == null ? null : Number(r.standard_price);
          r.last_receipt_cost = r.last_receipt_cost == null ? null : Number(r.last_receipt_cost);
        }
      }
  - id: assemble
    type: nest
    from: { vi: t_offer, ve: vendors }
    root:
      from: vi
      key: [ offer_id ]
      embed:
        - { from: ve, on: { vendor_id: vendor_id }, as: object, path: vendor, key: [ vendor_id ] }
  - id: shape
    from: [ assemble ]
    type: js
    script: |
      function process(record, ctx) {
        var r = record.after;
        if (r == null) return record;
        var v = r.vendor || {};
        var o = { offer_id: r.offer_id, product_number: r.product_number,
                  vendor: { vendor_id: r.vendor_id, account_number: v.account_number == null ? null : v.account_number,
                            name: v.name == null ? null : v.name,
                            credit_rating: v.credit_rating == null ? null : v.credit_rating,
                            preferred_vendor_status: v.preferred_vendor_status == null ? null : v.preferred_vendor_status,
                            active_flag: v.active_flag == null ? null : v.active_flag } };
        ['average_lead_time', 'standard_price', 'last_receipt_cost', 'last_receipt_date', 'min_order_qty',
         'max_order_qty', 'on_order_qty', 'unit_measure_code'].forEach(function (k) { o[k] = r[k] == null ? null : r[k]; });
        record.after = o;
        return record;
      }
view: { id: mfg_offer, from: shape, primary_key: offer_id }
