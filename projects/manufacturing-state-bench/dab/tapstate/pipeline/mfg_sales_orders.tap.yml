version: tapstate/v1
kind: pipeline
id: mfg_sales_orders
# One document per ERP sales order: the customer (with its store, by a join of customers and
# stores), the territory, and the lines with the product each names. Lines come from the staging
# view mfg_sales_line (SOURCE_SPLIT.md §3).
source: [ src_mfg_erp, src_mfg_stage ]
settings: { read_mode: snapshot_and_cdc }
transforms:
  - id: t_cust
    type: join
    from: { c: customers, s: stores }
    engine: builtin
    sql: |
      SELECT c.customer_id AS customer_id, c.account_number AS account_number, c.store_id AS store_id,
             s.name AS store_name
      FROM c LEFT JOIN s ON c.store_id = s.store_id
  - id: t_so
    from: [ sales_orders ]
    type: js
    script: |
      function process(record, ctx) {
        // the before image too: a delete carries only that, and the nest needs its join key
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      function fix(r) {
        if (r != null) ['sub_total', 'tax_amt', 'freight', 'total_due'].forEach(function (k) {
          r[k] = r[k] == null ? null : Number(r[k]); });
      }
  - id: assemble
    type: nest
    # the default keeps 4,000 entries per level in memory and serves the rest from MongoDB, which is
    # several times slower at this size; 250,000 holds every level of this dataset
    entries_in_memory: 250000
    from: { so: t_so, cu: t_cust, te: territories, li: mfg_sales_line }
    root:
      from: so
      key: [ sales_order_id ]
      embed:
        - { from: cu, on: { customer_id: customer_id }, as: object, path: customer, key: [ customer_id ] }
        - { from: te, on: { territory_id: territory_id }, as: object, path: territory, key: [ territory_id ] }
        - { from: li, on: { sales_order_id: sales_order_id }, as: array, path: lines, arrayKey: [ line_id ] }
  - id: shape
    from: [ assemble ]
    type: js
    script: |
      function only(r, keys) { var o = {}; keys.forEach(function (k) { o[k] = r[k] == null ? null : r[k]; }); return o; }
      function process(record, ctx) {
        var r = record.after;
        if (r == null) return record;
        var c = r.customer, t = r.territory;
        var doc = only(r, ['sales_order_id', 'revision_number', 'order_date', 'due_date', 'ship_date', 'status',
                           'online_order_flag', 'sales_order_number', 'purchase_order_number', 'account_number',
                           'sales_person_id', 'ship_method_id', 'sub_total', 'tax_amt', 'freight', 'total_due']);
        doc.customer = c == null ? null : { customer_id: c.customer_id, account_number: c.account_number,
          store: c.store_id == null ? null : { store_id: c.store_id, name: c.store_name } };
        doc.territory = t == null ? null : { territory_id: t.territory_id, name: t.name,
                                             country_region_code: t.country_region_code, group: t.territory_group };
        doc.lines = (r.lines || []).map(function (l) {
          return only(l, ['line_id', 'product', 'carrier_tracking_number', 'order_qty', 'special_offer_id', 'unit_price',
                          'unit_price_discount', 'line_total']); });
        record.after = doc;
        return record;
      }
view: { id: mfg_sales_order, from: shape, primary_key: sales_order_id }
