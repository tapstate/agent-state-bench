version: tapstate/v1
kind: pipeline
id: mfg_purchase_orders
# One document per purchase order: the vendor, the ship method, and the lines with the product each
# names. Lines come from the staging view mfg_po_line (SOURCE_SPLIT.md §3).
source: [ src_mfg_procurement, src_mfg_stage ]
settings: { read_mode: snapshot_and_cdc }
transforms:
  - id: t_po
    from: [ purchase_orders ]
    type: js
    script: |
      function process(record, ctx) {
        // the before image too: a delete carries only that, and the nest needs its join key
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      function fix(r) {
        if (r != null) ['sub_total', 'tax_amt', 'freight', 'total_due'].forEach(function (k) {
          r[k] = r[k] == null ? null : Number(r[k]); });
      }
  - id: assemble
    type: nest
    # the default keeps 4,000 entries per level in memory and serves the rest from MongoDB, which is
    # several times slower at this size; 250,000 holds every level of this dataset
    entries_in_memory: 250000
    from: { po: t_po, ve: vendors, sm: ship_methods, li: mfg_po_line }
    root:
      from: po
      key: [ purchase_order_id ]
      embed:
        - { from: ve, on: { vendor_id: vendor_id }, as: object, path: vendor, key: [ vendor_id ] }
        - { from: sm, on: { ship_method_id: ship_method_id }, as: object, path: ship_method, key: [ ship_method_id ] }
        - { from: li, on: { purchase_order_id: purchase_order_id }, as: array, path: lines, arrayKey: [ po_line_id ] }
  - id: shape
    from: [ assemble ]
    type: js
    script: |
      function only(r, keys) { var o = {}; keys.forEach(function (k) { o[k] = r[k] == null ? null : r[k]; }); return o; }
      function process(record, ctx) {
        var r = record.after;
        if (r == null) return record;
        var doc = only(r, ['purchase_order_id', 'revision_number', 'status', 'employee_id', 'order_date', 'ship_date',
                           'sub_total', 'tax_amt', 'freight', 'total_due']);
        doc.vendor = r.vendor == null ? null : only(r.vendor, ['vendor_id', 'account_number', 'name', 'credit_rating',
                                                              'preferred_vendor_status', 'active_flag']);
        doc.ship_method = r.ship_method == null ? null : { ship_method_id: r.ship_method.ship_method_id,
                                                           name: r.ship_method.name };
        doc.lines = (r.lines || []).map(function (l) {
          return only(l, ['po_line_id', 'product', 'due_date', 'order_qty', 'unit_price', 'line_total', 'received_qty',
                          'rejected_qty', 'stocked_qty']); });
        record.after = doc;
        return record;
      }
view: { id: mfg_purchase_order, from: shape, primary_key: purchase_order_id }
