version: tapstate/v1
kind: pipeline
id: mfg_products
# One document per product, consolidated from five systems (SOURCE_SPLIT.md §2): the PLM product
# master with its subcategory and category, model and bill of materials; costing's current prices
# and cost and price history; WMS stock per location; procurement's vendor offers with the vendor.
# WMS stock and procurement offers arrive already keyed by the canonical product number and carrying
# their location and vendor, from the staging views mfg_stock and mfg_offer (read through
# src_mfg_stage): on Tapstate 0.7.0 a many-to-one embed under an array element attaches to only one
# element of the whole level, so those lookups happen on a root, in the staging pipelines
# (SOURCE_SPLIT.md §3). Subcategory and model are referenced (many-to-one) rows of the root. A
# referenced row cannot carry embeds of its own, so the category reaches the product through a join
# of subcategories with categories, and `shape` turns it back into a nested object.
source: [ src_mfg_plm, src_mfg_costing, src_mfg_stage ]
settings: { read_mode: snapshot_and_cdc }
transforms:
  # --- PLM: canonical product numbers --------------------------------------------------------
  - id: t_subcat
    type: join
    from: { s: subcategories, c: categories }
    engine: builtin
    sql: |
      SELECT s.subcategory_id AS subcategory_id, s.name AS subcategory_name, s.category_id AS category_id,
             c.name AS category_name
      FROM s LEFT JOIN c ON s.category_id = c.category_id
  - id: t_bom
    # level-0 rows name no assembly: they mark a top-level product, not a component of one
    type: filter
    from: [ bom ]
    expr: "op == 'd' || type(after.assembly_number) != null_type"
  - id: t_bom_num
    from: [ t_bom ]
    type: js
    script: |
      function process(record, ctx) {
        // the before image too: a delete carries only that, and the nest needs its join key
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      function fix(r) { if (r != null) r.per_assembly_qty = r.per_assembly_qty == null ? null : Number(r.per_assembly_qty); }
  # --- costing: canonical product numbers; NUMERIC as numbers ----------------------------------
  - id: t_prices
    from: [ item_prices ]
    type: js
    script: |
      function process(record, ctx) {
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      function fix(r) {
        if (r != null) { r.standard_cost = Number(r.standard_cost); r.list_price = Number(r.list_price); }
      }
  - id: t_cost
    from: [ standard_cost_history ]
    type: js
    script: |
      function process(record, ctx) {
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      function fix(r) { if (r != null) r.standard_cost = Number(r.standard_cost); }
  - id: t_price
    from: [ list_price_history ]
    type: js
    script: |
      function process(record, ctx) {
        if (record.before != null) fix(record.before);
        fix(record.after);
        return record;
      }
      function fix(r) { if (r != null) r.list_price = Number(r.list_price); }
  # --- one document per product -----------------------------------------------------------------
  - id: assemble
    type: nest
    from: { p: products, sc: t_subcat, mo: models, ip: t_prices, ch: t_cost, ph: t_price, bo: t_bom_num,
            st: mfg_stock, vi: mfg_offer }
    root:
      from: p
      key: [ product_number ]
      embed:
        - { from: sc, on: { subcategory_id: subcategory_id }, as: object, path: subcategory, key: [ subcategory_id ] }
        - { from: mo, on: { model_id: model_id }, as: object, path: model, key: [ model_id ] }
        - { from: ip, on: { product_number: product_number }, as: object, path: prices, key: [ product_number ] }
        - { from: ch, on: { product_number: product_number }, as: array, path: standard_cost_history,
            arrayKey: [ start_date ] }
        - { from: ph, on: { product_number: product_number }, as: array, path: list_price_history,
            arrayKey: [ start_date ] }
        - { from: bo, on: { assembly_number: product_number }, as: array, path: bom, arrayKey: [ bom_id ] }
        - { from: st, on: { product_number: product_number }, as: array, path: inventory, arrayKey: [ stock_id ] }
        - { from: vi, on: { product_number: product_number }, as: array, path: vendors, arrayKey: [ offer_id ] }
  - id: shape
    from: [ assemble ]
    type: js
    script: |
      function num(v) { return v == null ? null : Number(v); }
      function only(r, keys) { var o = {}; keys.forEach(function (k) { o[k] = r[k] == null ? null : r[k]; }); return o; }
      function process(record, ctx) {
        var r = record.after;
        if (r == null) return record;
        var s = r.subcategory, m = r.model, ip = r.prices || {};
        var doc = only(r, ['product_number', 'name', 'make_flag', 'finished_goods_flag', 'color', 'safety_stock_level',
                           'reorder_point', 'size', 'size_unit_measure_code', 'weight_unit_measure_code', 'weight',
                           'days_to_manufacture', 'product_line', 'class', 'style', 'sell_start_date',
                           'sell_end_date', 'discontinued_date']);
        doc.standard_cost = ip.standard_cost == null ? null : ip.standard_cost;
        doc.list_price = ip.list_price == null ? null : ip.list_price;
        doc.subcategory = s == null ? null : { subcategory_id: s.subcategory_id, name: s.subcategory_name,
                                               category: { category_id: s.category_id, name: s.category_name } };
        doc.model = m == null ? null : { model_id: m.model_id, name: m.name };
        doc.standard_cost_history = (r.standard_cost_history || []).map(function (h) {
          return only(h, ['start_date', 'end_date', 'standard_cost']); });
        doc.list_price_history = (r.list_price_history || []).map(function (h) {
          return only(h, ['start_date', 'end_date', 'list_price']); });
        doc.bom = (r.bom || []).map(function (b) {
          return only(b, ['component_number', 'start_date', 'end_date', 'unit_measure_code', 'bom_level',
                          'per_assembly_qty']); });
        doc.inventory = (r.inventory || []).map(function (i) {
          var o = { location: { location_id: i.location_id, name: i.location_name } };
          ['shelf', 'bin', 'quantity'].forEach(function (k) { o[k] = i[k] == null ? null : i[k]; });
          return o; });
        doc.vendors = (r.vendors || []).map(function (v) {
          return only(v, ['vendor', 'average_lead_time', 'standard_price', 'last_receipt_cost', 'last_receipt_date',
                          'min_order_qty', 'max_order_qty', 'on_order_qty', 'unit_measure_code']); });
        record.after = doc;
        return record;
      }
view: { id: mfg_product, from: shape, primary_key: product_number }
