version: tapstate/v1
kind: source
id: src_mfg_ref
# The flat product reference the mfg_product_ref pipeline maintains (MongoDB views.mfg_product_ref),
# read back as a source: it carries the product number in every system's key format, and the
# product's name, subcategory and category, for the pipelines that attach a product to a row
# (SOURCE_SPLIT.md §3). A join or nest can only read source tables, not another pipeline's steps.
connector: mongodb
config: { isUri: true, uri: "mongodb://mongo:27017/views?directConnection=true" }
mode: cdc
tables: [ mfg_product_ref ]
