# The manufacturing benchmark's stack: the six source systems on three engines, and Tapstate Community
# 0.7.0 with its own MongoDB store (which also holds setup C, mfg_state).
#
#   postgres        Postgres 16: ERP sales (mfg_erp), PLM (mfg_plm), costing (mfg_costing)
#   mysql           MySQL 8: MES (mfg_mes), procurement (mfg_procurement); ROW binlog with GTIDs for CDC
#   mongo-sources   MongoDB 7, replica set rs1: WMS (mfg_wms); separate from Tapstate's store
#   mongo           MongoDB 7, replica set rs0: Tapstate's store, its views, and setup C (mfg_state)
#   server          Tapstate 0.7.0, reading the six source databases directly
#
# Derived from Tapstate's own quickstart (deploy/quickstart/docker-compose.yml at v0.7.0), with
# these changes: the server image is pinned to 0.7.0; every database is published on the loopback
# interface so the agents' tools reach them; Postgres allows more replication slots; MySQL uses a
# case- and accent-sensitive collation (utf8mb4_0900_bin) so key formats compare exactly as they do in
# Postgres. The MySQL connector is not bundled with the server: `tapstate register mysql` adds it
# (dab/run_tapstate.sh does).
#
# Ports can be moved with MONGO_PORT, MONGO_SOURCES_PORT, PG_PORT, MYSQL_PORT and TAPSTATE_PORT (../env.sh).
name: mfg-bench

services:
  mongo:
    image: mongo:7.0
    # A single-member replica set: Tapstate's store uses transactions, which need one.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) };
         if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s
    volumes:
      - mongo-data:/data/db

  postgres:
    image: postgres:16
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=20"
      - "-c"
      - "max_replication_slots=20"
    ports: ["127.0.0.1:${PG_PORT:-55432}:5432"]
    environment:
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    command:
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
      - "--log-bin=mysql-bin"
      - "--server-id=1"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_bin"
    ports: ["127.0.0.1:${MYSQL_PORT:-33306}:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin -uroot -psecret ping -h 127.0.0.1 --silent"]
      interval: 3s
      timeout: 10s
      retries: 60
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql

  mongo-sources:
    image: mongo:7.0
    # A single-member replica set: Tapstate reads WMS through change streams, which need one.
    command: ["--replSet", "rs1", "--bind_ip_all"]
    ports: ["127.0.0.1:${MONGO_SOURCES_PORT:-27018}:27017"]
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs1', members: [{ _id: 0, host: 'mongo-sources:27017' }] }) };
         if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s
    volumes:
      - mongo-sources-data:/data/db

  server:
    image: ghcr.io/tapstate/tapstate:0.7.0
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo-sources:
        condition: service_healthy
    environment:
      TAPSTATE_STORE_MONGO_URI: mongodb://mongo:27017/tapstate?directConnection=true
      TAPSTATE_STORE_MONGO_OPERATOR_STATE_DATABASE: tapstate_nest
    ports: ["127.0.0.1:${TAPSTATE_PORT:-8080}:8080"]
    stop_grace_period: 30s

  # Creates the first administrator, then exits (as in Tapstate's quickstart).
  bootstrap:
    image: curlimages/curl:8.11.1
    depends_on:
      server:
        condition: service_healthy
    network_mode: "service:server"
    restart: "no"
    environment:
      TAPSTATE_ADMIN_USER: admin
      TAPSTATE_ADMIN_PASSWORD: ${TAPSTATE_PASSWORD:-admin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        code=$$(curl -s -o /dev/null -w '%{http_code}' \
          -X POST http://127.0.0.1:8080/auth/bootstrap \
          -H 'Content-Type: application/json' \
          -d "{\"username\":\"$${TAPSTATE_ADMIN_USER}\",\"password\":\"$${TAPSTATE_ADMIN_PASSWORD}\"}")
        case "$$code" in
          204) echo "bootstrap: first admin created" ;;
          409) echo "bootstrap: an admin already exists, nothing to do" ;;
          *)   echo "bootstrap: failed with HTTP $$code" >&2; exit 1 ;;
        esac

volumes:
  mongo-data:
  postgres-data:
  mysql-data:
  mongo-sources-data:
